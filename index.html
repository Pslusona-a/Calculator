<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Style.css">
    <title>Calculator</title>
    <script src="index.js"></script>
</head>
<body onload = "storageFun()">
<div id = grid>
    <input id = mainBox type = text>
    <button onclick="down()" class="arrow"> ↑ </button>
    <p id = solved> </p>
    <button onclick="up()" class="arrow"> ↓ </button>
    <button onclick="place()" class="equation"> (</button>
    <button onclick="place2()" class="equation"> )</button>
    <button onclick="power()" class="equation"> **</button>
    <button onclick="multiply()" class="equation"> *</button>
    <button onclick="a()" class="number"> 1</button>
    <button onclick="b()" class="number"> 2</button>
    <button onclick="c()" class="number"> 3</button>
    <button onclick="divide()" class="equation"> /</button>
    <button onclick="d()" class="number"> 4</button>
    <button onclick="e()" class="number"> 5</button>
    <button onclick="f()" class="number"> 6</button>
    <button onclick="sub()" class="equation"> -</button>
    <button onclick="g()" class="number"> 7</button>
    <button onclick="h()" class="number"> 8</button>
    <button onclick="i()" class="number"> 9</button>
    <button onclick="ad()" class="equation"> +</button>
    <button onclick="j()" class="number"> 0</button>
    <button onclick="decimal()" class="number"> .</button>
    <button onclick="mod()" class = "number"> %</button>
    <button onclick="solve()" class="equation"> =</button>
</div>
</body>
</html>
